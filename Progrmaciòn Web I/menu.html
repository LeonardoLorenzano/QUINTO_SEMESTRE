<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #E3F2FD;        
        }

        a {
            color: #90CAF9; 
        }

        .men_item {
            background-color: #2196F3; 
            margin: 0.5rem; 
            padding: 5px 1rem; 
            border-radius: 0.25rem 1rem; 
        }
        
        /* ".men_item:hover": Sirve para que cuando pase el cursor 
        se cambie de color de la divicion */
        .men_item:hover {
            background-color: #0D47A1;
            border-radius: 1.5 rem;  
        }

        /* Solo se aplica a las clases que tengan menu */
        .menu {
            text-decoration: none; 
        }

    </style>
</head>

<body>
    <!-- Con # es id y con . es clase -->
    <div class="men_item"><a href="#electronica" class="menu">Electronica</a></div>
    <div class="men_item"><a href="#cocina" class="menu">Cocina</a></div>
    <div class="men_item"><a href="#herramientas" class="menu">Herramientas</a></div>
</body>
</html>
