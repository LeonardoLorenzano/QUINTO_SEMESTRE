<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Ejercicio 1. Estructura de HTML y Coreeción de Enlaves
            (Navegación e ID)
        </h1>
        
        <p> Mi Sitio web de aprendizaje </p>
        
        <!-- El href apunta al ID con el signo "#" -->
        <!-- Agrega aquí el atributo href apuntando al id correcto -->
    <a href="#aprendizaje">Aprendizaje</a>
    <a href="#teoria">Teoría</a>
    <a href="#ventas">Ventas</a>
</header>

<section id="aprendizaje">
    <h2>Aprendizaje</h2>
    <p>Contenido...</p>
</section>

<!-- Añade el id correspondiente -->
<section id="teoria">
    <h2>Teoría</h2>
    <p>Contenido de la sección teoría...</p>
</section>

<section id="ventas">
    <h2>Ventas</h2>
    <p>Contenido de la sección ventas...</p>
</section>

</body>
</html>
